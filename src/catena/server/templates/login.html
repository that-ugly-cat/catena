{% extends "base.html" %}
{% block title %}Sign in — catena{% endblock %}
{% block body %}
<div class="login">
  <h1>catena</h1>
  <p class="muted small">Zotero references inside Word documents.</p>
  {% if error %}<div class="flash">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="card">
    <label>Email<input type="email" name="email" required autocomplete="username" autofocus></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
